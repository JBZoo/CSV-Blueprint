name: Publish
permissions:
  contents: write

on:
  release:
    types: [ published ]

jobs:
  phar:
    name: Publish Phar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer

      - name: Build project in production mode
        run: make build-prod build-phar-file --no-print-directory

      - name: 🎨 Test Phar file
        run: ./build/csv-blueprint.phar --ansi -vvv

      - name: Upload Phar to the release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            ./build/csv-blueprint.phar

  docker:
    name: Publish Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/blackmesaltd/csv-blueprint
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check action.yml is pinned to this release
        run: |
          grep -qF "image: 'docker://${IMAGE}:${TAG}'" action.yml || {
            echo "::error file=action.yml::runs.image must be 'docker://${IMAGE}:${TAG}'"
            exit 1
          }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          context: .
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.TAG }}

      - name: Verify the Docker image by tag
        run: docker run --rm "${IMAGE}:${TAG}" --ansi -vvv

      - name: Verify the Docker image is publicly pullable
        run: |
          docker logout ghcr.io
          docker rmi "${IMAGE}:${TAG}" "${IMAGE}:latest" || true
          docker pull "${IMAGE}:${TAG}"
